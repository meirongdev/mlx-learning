[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlx-learning"
version = "0.1.0"
description = "A benchmark and learning tool for MLX on Apple Silicon"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Meirong", email = "meirongdev@gmail.com" }
]
license = { file = "LICENSE" }
dependencies = [
    # mlx-bench itself only talks HTTP; these back `make server-start`
    # (python -m mlx_lm.server / mlx_vlm.server) on the legacy :5001 path.
    "mlx>=0.23.0",
    "mlx-lm>=0.23.0",
    "mlx-vlm>=0.6.3",
    "requests>=2.32.5",
    "rich>=14.3.3",
    "typer>=0.18.0",
]

[project.optional-dependencies]
server = [
    "huggingface-hub>=1.10.2",  # model-download / sd-model-download
]

[project.scripts]
mlx-bench = "mlx_learning.benchmark_cli:app"

[tool.uv]
dev-dependencies = [
    "ruff>=0.9.1",
    "mypy>=1.15.0",
    "pytest>=8.3.4",
    "types-requests>=2.32.0",  # stubs for `requests` — mypy runs strict
]

[tool.ruff]
target-version = "py311"
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
]
ignore = ["E501"] # Ignore long lines (handled by formatter)

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
# Downloaded model weights are gitignored, but `mypy .` does not read .gitignore
# (ruff does). Some HF repos ship their own Python — e.g.
# models/kamilobad__GLM-ASR-Nano-2512-8bit carries modeling_glmasr.py and
# inference.py — which produced 50 strict-mode errors in vendored code.
exclude = '^(models|models-sd|models_cache|bin)/'

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
